[project]
name = "capbencher"
version = "0.1.0"
description = "Publish LLM Benchmark Without Giving the True Answers Away"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.12.0",
    "datasets>=4.5.0",
    "matplotlib>=3.10.0",
    "openai>=1.0.0",
    "pandas>=2.2.0",
    "scipy>=1.14.0",
    "seaborn>=0.13.2",
    "torch>=2.6.0",
    "tqdm>=4.67.0",
    "transformers>=4.56.0",
    "trl>=0.27.2",
    "wandb>=0.19.0",
]

[project.optional-dependencies]
gpu = ["vllm>=0.10.2"]
